# ══════════════════════════════════════════════════════════
#  Hermes-Auto-Extract 主配置
#  修改后运行 .\sync.ps1 写入 hermes-home/ 即可生效
#  （模型、provider、skills 由 Hermes 自己从 hermes-home/ 读取）
# ══════════════════════════════════════════════════════════

model:
  default: MiniMax-M3            # 模型名
  provider: custom:ai.14x.cn     # provider 名
  base_url: ''                   # 自定义 base_url（可选）

agent:
  max_turns: 60
  verbose: false
  reasoning_effort: high
terminal:
  backend: local
  cwd: .
  timeout: 180
browser:
  inactivity_timeout: 120
  allow_private_urls: true
display:
  language: zh-hant
  streaming: true
compression:
  enabled: true
memory:
  memory_enabled: true
delegation:
  max_iterations: 50
approvals:
  mode: 'off'
security:
  allow_private_urls: true
streaming:
  enabled: false

# ── 工具路径 ──
tools:
  assetstudio: "C:\\Users\\rayyi\\Desktop\\unityTools\\AssetStudioNet10V241\\AssetStudio.CLI.exe"
  il2cppdumper: "C:\\Users\\rayyi\\Desktop\\unityTools\\il2cppdumper\\Il2CppDumper.exe"
  il2cppdumper_config: "C:\\Users\\rayyi\\Desktop\\unityTools\\il2cppdumper\\config.json"

# ── MCP Servers ──
mcp_servers:
  idalib:
    command: conda
    args: ["run", "-n", "agent-ida", "idalib-mcp", "--stdio"]
    timeout: 300

# ── Custom providers ──
custom_providers:
  - name: Ai.14x.cn
    base_url: https://ai.14x.cn/hub/coding/v1
    api_key: your_api_key_here
    model: ark/glm-5.2
    models:
      - MiniMax-M3
      - deepseek-v4-flash
      - deepseek/deepseek-v4-flash
